<!--
  分类图标 · 图块模板（Paper write_html 片段）
  用法：把 {{GEN_URL}} 换成 paper-gen:// 生成地址；单次调用建议 ≤5 个图块（5 列一行）。
-->
<div style="display:flex;gap:26px;justify-content:flex-start;width:100%;">
  <div style="width:196px;display:flex;flex-direction:column;align-items:center;gap:14px;">
    <img src="{{GEN_URL}}" layer-name="icon-粮油调味"
         style="width:196px;height:196px;border-radius:44px;" />
    <div style="font-family:'Noto Sans SC';font-size:22px;font-weight:700;color:#1A1A1A;letter-spacing:0.02em;line-height:28px;text-align:center;">粮油调味</div>
  </div>
  <!-- 其余 4 个图块同构，重复即可 -->
</div>

<!--
  单图块（第 3 页等扩展页）：行改为水平居中，不要用 flex-start。
-->
<div style="display:flex;justify-content:center;width:100%;">
  <div style="width:196px;display:flex;flex-direction:column;align-items:center;gap:14px;">
    <img src="{{GEN_URL}}" layer-name="icon-宠物用品"
         style="width:196px;height:196px;border-radius:44px;" />
    <div style="font-family:'Noto Sans SC';font-size:22px;font-weight:700;color:#1A1A1A;letter-spacing:0.02em;line-height:28px;text-align:center;">宠物用品</div>
  </div>
</div>
