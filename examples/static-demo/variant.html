<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工单列表 · 有缺陷的实现</title>
<style>
  :root {
    --color-bg: #f6f8fb;
    --color-panel: #ffffff;
    --color-ink: #0f172a;
    --color-muted: #64748b;
    --color-line: #e2e8f0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 200px; flex: 0 0 200px; background: #0f172a; color: #cbd5e1; padding: 20px 16px; }
  .brand { font-size: 16px; font-weight: 600; color: #f8fafc; margin-bottom: 24px; }
  .nav-item { padding: 9px 10px; border-radius: 6px; color: #cbd5e1; font-size: 14px; margin-bottom: 4px; }
  .nav-item.active { background: rgba(255, 255, 255, 0.12); color: #ffffff; }
  .main { flex: 1 1 auto; min-width: 0; }
  .topbar { height: 52px; background: var(--color-panel); border-bottom: 1px solid var(--color-line); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .crumb { color: var(--color-muted); font-size: 13px; }
  .user { font-size: 13px; color: var(--color-ink); }
  .content { padding: 20px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  /* 缺陷 1：标题字号偏大（设计稿 20px，这里 24px） */
  .page-title { font-size: 24px; font-weight: 600; color: #0f172a; margin: 0; }
  .page-sub { color: var(--color-muted); font-size: 13px; margin-top: 4px; }
  .btn { height: 34px; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--color-line); background: #ffffff; color: #334155; font-size: 14px; cursor: pointer; }
  /* 缺陷 2：主色错误（设计稿 #2563eb，这里红色） */
  .btn-primary { height: 34px; padding: 8px 16px; border-radius: 6px; border: 1px solid #dc2626; background: #dc2626; color: #ffffff; font-size: 14px; cursor: pointer; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--color-panel); border: 1px solid var(--color-line); border-radius: 8px; padding: 16px; }
  .stat-label { color: var(--color-muted); font-size: 12px; }
  .stat-value { font-size: 24px; font-weight: 600; margin-top: 6px; }
  /* 缺陷 3：卡片内边距不一致（设计稿 16px，这里 24px） */
  .card { background: var(--color-panel); border: 1px solid var(--color-line); border-radius: 8px; padding: 24px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .input { height: 32px; width: 200px; border: 1px solid var(--color-line); border-radius: 6px; padding: 0 10px; font-size: 13px; color: #334155; background: #ffffff; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th { text-align: left; font-size: 13px; font-weight: 600; color: #475569; background: #f8fafc; padding: 10px 10px; border-bottom: 1px solid var(--color-line); }
  .data-table td { padding: 9px 10px; border-bottom: 1px solid var(--color-line); color: #334155; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; }
  .tag-ok { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .tag-wait { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
  .pager { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 14px; color: var(--color-muted); font-size: 13px; }
  .pager button { height: 28px; min-width: 28px; border: 1px solid var(--color-line); background: #ffffff; border-radius: 6px; font-size: 13px; color: #334155; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">示例控制台</div>
    <div class="nav-item active">工单列表</div>
    <div class="nav-item">数据看板</div>
    <div class="nav-item">系统设置</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <span class="crumb">首页 / 工单 / 列表</span>
      <span class="user">管理员</span>
    </header>
    <main class="content">
      <div class="page-head">
        <div>
          <h1 class="page-title">工单列表</h1>
          <div class="page-sub">按状态与时间筛选，支持批量导出。</div>
        </div>
        <div class="page-actions">
          <button class="btn">导出</button>
          <button class="btn-primary">新建工单</button>
        </div>
      </div>

      <section class="stats">
        <div class="stat"><div class="stat-label">待处理</div><div class="stat-value">12</div></div>
        <div class="stat"><div class="stat-label">处理中</div><div class="stat-value">8</div></div>
        <div class="stat"><div class="stat-label">今日完成</div><div class="stat-value">31</div></div>
        <div class="stat"><div class="stat-label">超时</div><div class="stat-value">2</div></div>
      </section>

      <div class="card">
        <div class="toolbar">
          <input class="input" placeholder="工单号 / 标题" />
          <select class="input" aria-label="状态">
            <option>全部状态</option>
            <option>待处理</option>
            <option>处理中</option>
          </select>
          <button class="btn-primary">查询</button>
          <button class="btn">重置</button>
        </div>
        <table class="data-table">
          <thead>
            <tr><th>工单号</th><th>标题</th><th>状态</th><th>负责人</th><th>更新时间</th></tr>
          </thead>
          <tbody>
            <tr><td>WO-1001</td><td>登录页样式错位</td><td><span class="tag tag-ok">已完成</span></td><td>张三</td><td>2026-11-23 09:12</td></tr>
            <tr><td>WO-1002</td><td>列表分页失效</td><td><span class="tag tag-wait">待处理</span></td><td>李四</td><td>2026-11-23 09:40</td></tr>
            <tr><td>WO-1003</td><td>导出字段缺失</td><td><span class="tag tag-wait">处理中</span></td><td>王五</td><td>2026-11-23 10:05</td></tr>
            <tr><td>WO-1004</td><td>筛选条件不生效</td><td><span class="tag tag-ok">已完成</span></td><td>赵六</td><td>2026-11-23 10:22</td></tr>
            <tr><td>WO-1005</td><td>弹窗确认文案</td><td><span class="tag tag-ok">已完成</span></td><td>张三</td><td>2026-11-23 10:48</td></tr>
          </tbody>
        </table>
        <div class="pager">
          <span>共 5 条</span>
          <button>1</button>
          <button>2</button>
          <button>下一页</button>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
